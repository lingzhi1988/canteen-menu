<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>📋 今日食堂菜单</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f7f8fa;color:#333;padding-bottom:80px}
        .header{background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff;padding:28px 20px 20px;text-align:center;position:relative}
        .header::after{content:'';position:absolute;bottom:-20px;left:0;right:0;height:20px;background:#f7f8fa;border-radius:20px 20px 0 0}
        .badge{display:inline-block;background:rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;font-size:12px;margin-bottom:6px}
        .header h1{font-size:22px;font-weight:700}
        .header .date{font-size:14px;opacity:.9;margin-top:2px}
        .tabs{display:flex;background:#fff;margin:16px 14px 0;border-radius:12px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
        .tab-btn{flex:1;padding:10px 0;border:none;background:transparent;font-size:15px;font-weight:500;color:#999;cursor:pointer;border-radius:10px;transition:all .3s}
        .tab-btn.active{background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff;box-shadow:0 2px 8px rgba(255,107,53,.3)}
        .mc{padding:14px;display:none}.mc.active{display:block;animation:fadeIn .3s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .day-card{background:#fff;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
        .day-header{background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff;padding:10px 16px;font-size:16px;font-weight:600}
        .cs{padding:4px 16px 8px;border-bottom:1px dashed #f0f0f0}
        .cl{font-size:13px;font-weight:600;color:#f7931e;padding:6px 0 2px}
        .mi{display:flex;justify-content:space-between;align-items:center;padding:7px 8px 7px 36px;font-size:14px;border-bottom:1px solid #f8f8f8;cursor:pointer;position:relative;border-radius:6px;margin:1px 0;user-select:none}
        .mi:hover{background:#fffaf5}
        .mi .n{color:#333;flex:1}
        .mi .p{color:#ff6b35;font-weight:600;font-size:13px;background:#fff5f0;padding:1px 8px;border-radius:10px}
        .mi .ck{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:2px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:#fff}
        .mi.sel{background:#f0fdf4}
        .mi.sel .n{color:#166534;font-weight:500}
        .mi.sel .p{background:#22c55e;color:#fff}
        .mi.sel .ck{background:#22c55e;border-color:#22c55e}
        .mi.sel .ck::after{content:'✓'}
        .wk{text-align:center;padding:60px 20px;background:#fff;border-radius:14px;margin:14px}
        .wk .bi{font-size:48px;margin-bottom:12px}
        .info{background:#fff;margin:0 14px 14px;border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);font-size:13px;line-height:1.8;color:#666}
        .info .t{font-weight:600;color:#333;margin-bottom:4px}
        .nav{display:flex;gap:10px;margin:0 14px 14px}
        .nv{flex:1;display:block;padding:10px;border:none;border-radius:10px;font-size:13px;cursor:pointer;text-align:center;text-decoration:none;background:#fff;color:#1a73e8;box-shadow:0 2px 8px rgba(0,0,0,.05)}
        .cb{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.1);padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:100;transition:transform .3s}
        .cb.et{transform:translateY(100%)}
        .ci{width:40px;height:40px;background:linear-gradient(135deg,#ff6b35,#f7931e);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;position:relative;flex-shrink:0}
        .ci .bd{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .ci2{flex:1;min-width:0}
        .ci2 .pr{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .ci2 .tl{font-size:18px;font-weight:700;color:#ff6b35}
        .ci2 .tl small{font-size:12px;font-weight:400;color:#999}
        .bch{padding:10px 22px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0}
        .co{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-end}
        .co.sh{display:flex}
        .cs2{background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 30px;width:100%;max-height:75vh;overflow-y:auto;animation:su .3s}
        @keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .cs2 .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #f0f0f0}
        .cs2 .sh h2{font-size:18px}
        .cs2 .sc{background:none;border:none;font-size:22px;color:#999;cursor:pointer;padding:4px}
        .c2i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
        .c2i .l{display:flex;align-items:center;gap:8px;flex:1}.c2i .nm{color:#333}
        .c2i .pr2{color:#ff6b35;font-weight:600}
        .c2i .dl{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:2px 6px}
        .c2i .dl:hover{color:#ef4444}
        .ct2{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:18px;font-weight:700}
        .ct2 .cp{color:#ff6b35}
        .ec{text-align:center;padding:30px 0;color:#ccc}
        .ft{text-align:center;padding:20px 14px;font-size:12px;color:#ccc}
        @media(min-width:768px){.mc,.tabs,.nav,.info{max-width:800px;margin-left:auto;margin-right:auto}}
    </style>
</head>
<body>
<div class="header">
    <div class="badge" id="todayBadge">📅 今天</div>
    <h1>职工食堂</h1>
    <div class="date" id="todayDate"></div>
</div>
<div class="tabs" id="mealTabs"></div>
<div id="menuContent"></div>
<div class="nav"><a class="nv" href="menu.html" target="_blank">📋 本周完整菜单</a></div>
<div class="info">
    <div class="t">⏰ 开餐时间</div>
    负一层：早餐 7:10-8:40 · 午餐 11:30-12:40 · 晚餐 17:30-18:20<br>
    二层：午餐 11:40-12:30 · 晚餐 17:30-18:20<br>
    周六、日（仅午餐）：负一层 11:40-12:20
</div>
<div class="ft">点击菜品可加入购物车</div>
<div class="cb et" id="cartBar">
    <div class="ci">🛒<div class="bd" id="cartBadge">0</div></div>
    <div class="ci2"><div class="pr" id="cartPreview">尚未选择菜品</div><div class="tl" id="cartTotal">¥0 <small>已选 <span id="cartCount">0</span> 项</small></div></div>
    <button class="bch" onclick="showCheckout()">查看清单</button>
</div>
<div class="co" id="checkoutOverlay">
    <div class="cs2">
        <div class="sh"><h2>🧾 我的点菜单</h2><button class="sc" onclick="closeCheckout()">✕</button></div>
        <div id="checkoutList"></div>
        <div class="ct2"><span>合计</span><span class="cp" id="checkoutTotal">¥0</span></div>
        <div style="text-align:center;margin-top:12px;font-size:12px;color:#ccc">点击 ✕ 可移除</div>
    </div>
</div>

<script>
const DAY_NAMES=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const DAY_MAP={1:"星期一",2:"星期二",3:"星期三",4:"星期四",5:"星期五"};
const MEAL_NAMES={breakfast:'早餐',lunch:'午餐',dinner:'晚餐'};
let menuData=null;
let cart=[];
let currentTab='breakfast';

function getToday(){
    const n=new Date();
    return{day:n.getDay(),dateStr:n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日',cnDay:DAY_MAP[n.getDay()]}
}

function getCurrentMeal(){
    const h=new Date().getHours();
    if(h>=5&&h<10) return 'breakfast';
    if(h>=10&&h<15) return 'lunch';
    if(h>=15&&h<20) return 'dinner';
    return 'breakfast';
}

async function loadData(){
    try{
        const res=await fetch('data.json?'+Date.now());
        menuData=await res.json();
        initTabs();
        render();
    }catch(e){
        document.getElementById('menuContent').innerHTML='<div style="text-align:center;padding:40px;color:#999">⚠️ 数据加载失败</div>';
    }
}

function initTabs(){
    const meals=['breakfast','lunch','dinner'];
    const labels=['🌅 早餐','☀️ 午餐','🌙 晚餐'];
    const defaultMeal=getCurrentMeal();
    const html=meals.map((m,i)=>`<button class="tab-btn${m===defaultMeal?' active':''}" onclick="switchTab('${m}',this)">${labels[i]}</button>`).join('');
    document.getElementById('mealTabs').innerHTML=html;
    currentTab=defaultMeal;
}

function render(){
    const today=getToday();
    document.getElementById('todayDate').textContent=today.dateStr+' '+DAY_NAMES[today.day];
    document.getElementById('todayBadge').textContent='📅 '+today.dayName;
    if(!today.cnDay){
        document.getElementById('menuContent').innerHTML='<div class="wk"><div class="bi">😴</div><h3>今日休息，无供餐</h3><p>周一到周五再来！</p></div>';
        document.getElementById('mealTabs').style.display='none';
        return;
    }
    document.getElementById('mealTabs').style.display='flex';
    const dayData=menuData[today.cnDay];
    let fullHtml='';
    ['breakfast','lunch','dinner'].forEach(meal=>{
        const mealData=dayData&&dayData[meal];
        const isActive=meal===currentTab;
        let h=`<div id="tab-${meal}" class="mc${isActive?' active':''}">`;
        if(!mealData||Object.keys(mealData).length===0){
            h+=`<div class="day-card"><div class="day-header">${today.cnDay} · ${MEAL_NAMES[meal]}</div><div style="padding:30px;text-align:center;color:#ccc">暂无菜品</div></div>`;
        }else{
            h+=`<div class="day-card"><div class="day-header">${today.cnDay} · ${MEAL_NAMES[meal]}</div>`;
            Object.keys(mealData).forEach(cat=>{
                h+=`<div class="cs"><div class="cl">${cat}</div>`;
                mealData[cat].forEach((item,idx)=>{
                    const key=today.cnDay+'_'+meal+'_'+cat+'_'+idx;
                    h+=`<div class="mi" data-key="${key}" onclick="toggleItem('${key}','${item.name}','${item.price}',this)">
                        <span class="ck"></span><span class="n">${item.name}</span><span class="p">¥${item.price}</span></div>`;
                });
                h+=`</div>`;
            });
            h+=`</div>`;
        }
        h+=`</div>`;
        fullHtml+=h;
    });
    document.getElementById('menuContent').innerHTML=fullHtml;
    // 恢复选中
    cart.forEach(c=>{document.querySelectorAll('.mi[data-key="'+c.key+'"]').forEach(el=>el.classList.add('sel'))});
}

function switchTab(tab,btn){
    currentTab=tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    if(btn)btn.classList.add('active');
    document.querySelectorAll('.mc').forEach(c=>c.classList.remove('active'));
    const el=document.getElementById('tab-'+tab);
    if(el)el.classList.add('active');
}

function toggleItem(key,name,price,el){
    const idx=cart.findIndex(c=>c.key===key);
    if(idx>=0){cart.splice(idx,1);el.classList.remove('sel')}
    else{cart.push({key,name,price:parseFloat(price)});el.classList.add('sel')}
    updateCart();
}

function updateCart(){
    const bar=document.getElementById('cartBar');
    const badge=document.getElementById('cartBadge');
    const preview=document.getElementById('cartPreview');
    const total=document.getElementById('cartTotal');
    const c=document.getElementById('cartCount');
    const sum=cart.reduce((s,it)=>s+it.price,0);
    if(cart.length===0){bar.classList.add('et');badge.textContent='0';preview.textContent='尚未选择菜品'}
    else{
        bar.classList.remove('et');
        badge.textContent=cart.length;
        preview.textContent=cart.map(it=>it.name).join('、').slice(0,30)+(cart.map(it=>it.name).join('、').length>30?'…':'');
    }
    total.innerHTML='¥'+sum.toFixed(2)+' <small>已选 '+cart.length+' 项</small>';
    c.textContent=cart.length;
    renderCheckout();
}

function showCheckout(){if(cart.length===0)return;document.getElementById('checkoutOverlay').classList.add('sh');renderCheckout()}
function closeCheckout(){document.getElementById('checkoutOverlay').classList.remove('sh')}
function renderCheckout(){
    const list=document.getElementById('checkoutList');
    const total=document.getElementById('checkoutTotal');
    const sum=cart.reduce((s,it)=>s+it.price,0);
    if(cart.length===0){list.innerHTML='<div class="ec">🛒 尚未选择菜品</div>';total.textContent='¥0';return}
    list.innerHTML=cart.map((c,i)=>'<div class="c2i"><div class="l"><span class="nm">'+c.name+'</span></div><span class="pr2">¥'+c.price.toFixed(2)+'</span><button class="dl" onclick="removeCart('+i+')">✕</button></div>').join('');
    total.textContent='¥'+sum.toFixed(2);
}
function removeCart(i){
    const item=cart[i];cart.splice(i,1);
    document.querySelectorAll('.mi[data-key="'+item.key+'"]').forEach(el=>el.classList.remove('sel'));
    updateCart();
}
document.getElementById('checkoutOverlay').addEventListener('click',function(e){if(e.target===this)closeCheckout()});
loadData();
// 自动处理缓存：如果URL没有参数则重定向到带时间戳的版本
if(window.location.href.indexOf('?')===-1&&window.location.href.indexOf('github.io')>0){
    setTimeout(function(){
        window.location.replace(window.location.href+'?v='+new Date().getTime());
    },100);
}
</script>
</body>
</html>
